[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-coder"
version = "1.0.0"
description = "APEX - AI powered terminal coding assistant"
authors = [{name = "Parin Prajapati", email = "parin0127@gmail.com"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["ai", "coding", "assistant", "agent", "terminal", "groq", "mistral"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "groq",
    "openai",
    "rich",
    "python-dotenv",
    "langchain-huggingface",
    "langchain-chroma",
    "langchain-text-splitters",
    "langchain-community",
    "requests",
    "watchdog",
]

[project.scripts]
apex = "apex.agent.main:main"

[project.urls]
Homepage = "https://github.com/parinprajapati/apex"